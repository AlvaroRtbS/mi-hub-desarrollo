<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <title>Sin conexión · mi-hub</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #0a0a0a;
        background-image: radial-gradient(120% 80% at 50% 0%, rgba(22,163,74,0.22) 0%, transparent 50%);
        color: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 320px; }
      .logo {
        width: 72px; height: 72px; margin: 0 auto 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #16a34a, #15803d);
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; font-weight: 700; color: #fff; letter-spacing: -2px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #a3a3a3; margin: 0 0 20px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #16a34a; color: #fff;
        font-size: 14px; font-weight: 600;
        padding: 12px 20px; border-radius: 12px;
      }
      button:active { background: #15803d; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">mh</div>
      <h1>Sin conexión</h1>
      <p>No hay internet ahora mismo. Revisa tu conexión y vuelve a intentarlo — tus datos te esperan.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
